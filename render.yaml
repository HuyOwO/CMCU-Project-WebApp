# Render Blueprint — cho phép deploy backend chỉ bằng vài cú click
# Cách dùng: vào https://dashboard.render.com/blueprints -> New Blueprint Instance
# -> chọn repo GitHub này -> Render tự đọc file này để tạo service.

services:
  - type: web
    name: dothatlac-hn-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_RESET_URL
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
