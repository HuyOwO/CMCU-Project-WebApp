<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồ Thất Lạc Hà Nội</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }

    .header { background: #fff; padding: 1rem 1.5rem; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: .9rem 1rem; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 600; }
    .stat-label { font-size: 12px; color: #666; margin-top: 2px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: .75rem; flex-wrap: wrap; }
    .toolbar input { flex: 1; min-width: 180px; padding: 9px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 14px; outline: none; }
    .toolbar input:focus { border-color: #3b82f6; }
    .toolbar select { padding: 9px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 14px; outline: none; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab { padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #555; }
    .tab.active { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; font-weight: 500; }

    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; margin-bottom: .75rem; transition: border-color .15s, box-shadow .15s; display: flex; flex-direction: row; }
    .card:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(59,130,246,0.08); }
    .card-body { padding: 1rem 1.25rem; flex: 1; min-width: 0; }
    .card-img-wrap { width: 120px; min-width: 120px; max-width: 120px; border-left: 1px solid #f0f0f0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f9f9f9; }
    .card-img { width: 120px; height: 100%; object-fit: cover; display: block; min-height: 100%; }
    .card-img-placeholder { width: 120px; height: 100%; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; color: #ccc; gap: 6px; }
    .card-img-placeholder span { font-size: 11px; color: #bbb; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .badge-lost { background: #fee2e2; color: #991b1b; }
    .badge-found { background: #dcfce7; color: #166534; }
    .badge-closed { background: #f3f4f6; color: #6b7280; }
    .new-tag { font-size: 10px; background: #fef3c7; color: #92400e; padding: 2px 7px; border-radius: 10px; margin-left: 6px; font-weight: 600; }
    .card-title { font-size: 15px; font-weight: 600; margin: .4rem 0 .25rem; }
    .card-meta { font-size: 12px; color: #666; display: flex; gap: 12px; flex-wrap: wrap; }
    .card-meta span { display: flex; align-items: center; gap: 4px; }
    .card-desc { font-size: 13px; color: #555; margin-top: .5rem; line-height: 1.5; }
    .time-label { font-size: 11px; color: #999; white-space: nowrap; }

    .card-phone { margin-top: .6rem; display: flex; align-items: center; gap: 8px; }
    .phone-masked { font-size: 13px; color: #2563eb; font-weight: 500; cursor: pointer; user-select: none; }
    .phone-masked:hover { text-decoration: underline; }
    .phone-hint { font-size: 11px; color: #999; }

    .empty { text-align: center; padding: 3rem 0; color: #999; font-size: 14px; }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }

    .btn-primary { padding: 9px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost { padding: 9px 16px; background: #fff; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; color: #333; }
    .btn-ghost:hover { background: #f5f5f5; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-start; justify-content: center; z-index: 100; overflow-y: auto; padding: 2rem 1rem; }
    .modal { background: #fff; border-radius: 14px; padding: 1.5rem; width: 92%; max-width: 480px; margin: auto; }
    .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 1rem; }
    .form-row { margin-bottom: .75rem; }
    .form-row label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; font-weight: 500; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; font-family: inherit; outline: none; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #3b82f6; }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }

    .img-upload-box { border: 2px dashed #ddd; border-radius: 8px; padding: 1.2rem; text-align: center; cursor: pointer; transition: border-color .15s; position: relative; }
    .img-upload-box:hover { border-color: #3b82f6; }
    .img-upload-box input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .img-upload-box .upload-icon { font-size: 28px; margin-bottom: 6px; }
    .img-upload-box p { font-size: 13px; color: #888; }
    .img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }

    @media (max-width: 500px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    🔍 Đồ Thất Lạc HN
    <div class="live-dot" title="Cập nhật realtime"></div>
  </div>
  <button class="btn-primary" onclick="openModal()">+ Đăng tin</button>
</div>

<div class="container">
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="total-count">0</div>
      <div class="stat-label">Tổng tin</div>
    </div>
    <div class="stat">
      <div class="stat-num" style="color:#991b1b" id="lost-count">0</div>
      <div class="stat-label">Đang tìm</div>
    </div>
    <div class="stat">
      <div class="stat-num" style="color:#166534" id="found-count">0</div>
      <div class="stat-label">Tìm thấy</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="🔎  Tìm theo tên đồ, địa điểm..." oninput="renderFeed()">
    <select id="district-filter" onchange="renderFeed()">
      <option value="">Tất cả quận</option>
      <option>Hoàn Kiếm</option><option>Đống Đa</option><option>Hai Bà Trưng</option>
      <option>Ba Đình</option><option>Cầu Giấy</option><option>Thanh Xuân</option>
      <option>Long Biên</option><option>Hoàng Mai</option><option>Tây Hồ</option>
      <option>Nam Từ Liêm</option><option>Bắc Từ Liêm</option>
    </select>
  </div>

  <div class="filter-tabs">
    <button class="tab active" onclick="setTab('all',this)">Tất cả</button>
    <button class="tab" onclick="setTab('lost',this)">Mất đồ</button>
    <button class="tab" onclick="setTab('found',this)">Tìm thấy</button>
  </div>

  <div id="feed"></div>
</div>

<!-- Modal đăng tin -->
<div class="modal-bg" id="modal" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h3>📝 Đăng tin mới</h3>
    <div class="form-row">
      <label>Loại tin</label>
      <select id="f-type">
        <option value="lost">Tôi bị mất đồ</option>
        <option value="found">Tôi tìm thấy đồ</option>
      </select>
    </div>
    <div class="form-row">
      <label>Tên đồ vật *</label>
      <input type="text" id="f-name" placeholder="VD: Ví da màu đen, Điện thoại iPhone 14...">
    </div>
    <div class="form-row">
      <label>Quận / Khu vực *</label>
      <select id="f-district">
        <option>Hoàn Kiếm</option><option>Đống Đa</option><option>Hai Bà Trưng</option>
        <option>Ba Đình</option><option>Cầu Giấy</option><option>Thanh Xuân</option>
        <option>Long Biên</option><option>Hoàng Mai</option><option>Tây Hồ</option>
        <option>Nam Từ Liêm</option><option>Bắc Từ Liêm</option>
      </select>
    </div>
    <div class="form-row">
      <label>Địa điểm cụ thể *</label>
      <input type="text" id="f-location" placeholder="VD: Hồ Hoàn Kiếm, Siêu thị BigC Thăng Long...">
    </div>
    <div class="form-row">
      <label>Số điện thoại liên hệ *</label>
      <input type="tel" id="f-phone" placeholder="VD: 0912345678" maxlength="11">
    </div>
    <div class="form-row">
      <label>Mô tả thêm</label>
      <textarea id="f-desc" placeholder="Màu sắc, đặc điểm nhận dạng..."></textarea>
    </div>
    <div class="form-row">
      <label>Ảnh đồ vật</label>
      <div class="img-upload-box" onclick="document.getElementById('f-img').click()">
        <input type="file" id="f-img" accept="image/*" onchange="previewImg(event)" style="display:none">
        <div class="upload-icon">📷</div>
        <p id="upload-text">Bấm để chọn ảnh (JPG, PNG...)</p>
        <img id="img-preview" class="img-preview" alt="preview">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal()">Hủy</button>
      <button class="btn-primary" onclick="submitPost()">Đăng ngay</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let imgDataUrl = null;

  function previewImg(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      imgDataUrl = ev.target.result;
      const preview = document.getElementById('img-preview');
      preview.src = imgDataUrl;
      preview.style.display = 'block';
      document.getElementById('upload-text').textContent = '✅ ' + file.name;
    };
    reader.readAsDataURL(file);
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 8) return phone;
    return phone.slice(0, 3) + 'x xxx x' + phone.slice(-2);
  }

  let posts = [
    {id:1,type:'lost',name:'Ví da màu nâu',district:'Hoàn Kiếm',location:'Phố Hàng Bài',desc:'Bên trong có CMND và thẻ ngân hàng.',phone:'0912345678',img:null,time:Date.now()-300000,isNew:false},
    {id:2,type:'found',name:'Điện thoại Samsung Galaxy',district:'Đống Đa',location:'Gần ĐH Bách Khoa',desc:'Màn hình có vết nứt nhỏ, case màu xanh. Đang giữ hộ tại bảo vệ.',phone:'0976543210',img:null,time:Date.now()-600000,isNew:false},
    {id:3,type:'lost',name:'Chìa khóa xe máy',district:'Cầu Giấy',location:'TTTM Cầu Giấy',desc:'Có móc khóa hình gấu nhỏ màu vàng.',phone:'0987654321',img:null,time:Date.now()-900000,isNew:false},
    {id:4,type:'found',name:'Ba lô màu đen',district:'Hai Bà Trưng',location:'Công viên Thống Nhất',desc:'Bên trong có sách vở học sinh. Để tại bảo vệ cổng chính.',phone:'0961234567',img:null,time:Date.now()-1800000,isNew:false},
    {id:5,type:'lost',name:'Kính mắt gọng vàng',district:'Ba Đình',location:'BV Hữu Nghị',desc:'Kính cận -3.5 độ, rất cần dùng.',phone:'0934567890',img:null,time:Date.now()-3600000,isNew:false},
  ];
  let nextId = 6;
  let activeTab = 'all';
  let revealedPhones = new Set();

  function timeAgo(ts) {
    const diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'Vừa đăng';
    if (diff < 3600) return Math.floor(diff / 60) + ' phút trước';
    if (diff < 86400) return Math.floor(diff / 3600) + ' giờ trước';
    return Math.floor(diff / 86400) + ' ngày trước';
  }

  function setTab(t, el) {
    activeTab = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    renderFeed();
  }

  function revealPhone(id) {
    revealedPhones.add(id);
    renderFeed();
  }

  function renderFeed() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const dist = document.getElementById('district-filter').value;
    let filtered = posts.filter(p => {
      if (activeTab !== 'all' && p.type !== activeTab) return false;
      if (dist && p.district !== dist) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.location.toLowerCase().includes(q) && !p.district.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => b.time - a.time);

    document.getElementById('total-count').textContent = posts.length;
    document.getElementById('lost-count').textContent = posts.filter(p => p.type === 'lost').length;
    document.getElementById('found-count').textContent = posts.filter(p => p.type === 'found').length;

    const feed = document.getElementById('feed');
    if (!filtered.length) {
      feed.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Không có tin nào phù hợp</div>';
      return;
    }

    feed.innerHTML = filtered.map(p => {
      const imgSection = p.img
        ? `<div class="card-img-wrap"><img class="card-img" src="${p.img}" alt="${p.name}"></div>`
        : `<div class="card-img-wrap"><div class="card-img-placeholder">📷<span>Chưa có ảnh</span></div></div>`;

      const isRevealed = revealedPhones.has(p.id);
      const phoneHtml = p.phone ? `
        <div class="card-phone">
          📞
          ${isRevealed
            ? `<span class="phone-masked" style="color:#166534">${p.phone}</span>`
            : `<span class="phone-masked" onclick="revealPhone(${p.id})">${maskPhone(p.phone)} <span class="phone-hint">(bấm để xem)</span></span>`
          }
        </div>` : '';

      return `
        <div class="card">
          <div class="card-body">
            <div class="card-top">
              <div>
                <span class="badge badge-${p.type}">${p.type === 'lost' ? '🚨 Mất đồ' : '✅ Tìm thấy'}</span>
                ${p.isNew ? '<span class="new-tag">MỚI</span>' : ''}
                <div class="card-title">${p.name}</div>
              </div>
              <span class="time-label">${timeAgo(p.time)}</span>
            </div>
            <div class="card-meta">
              <span>📍 ${p.district}</span>
              <span>🏢 ${p.location}</span>
            </div>
            <div class="card-desc">${p.desc}</div>
            ${phoneHtml}
          </div>
          ${imgSection}
        </div>
      `;
    }).join('');
  }

  function openModal() {
    imgDataUrl = null;
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('upload-text').textContent = 'Bấm để chọn ảnh (JPG, PNG...)';
    document.getElementById('modal').style.display = 'flex';
  }
  function closeModal() { document.getElementById('modal').style.display = 'none'; }
  function handleOverlayClick(e) { if (e.target.id === 'modal') closeModal(); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function submitPost() {
    const name = document.getElementById('f-name').value.trim();
    const location = document.getElementById('f-location').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    if (!name || !location) { alert('Vui lòng điền tên đồ vật và địa điểm!'); return; }
    if (!phone) { alert('Vui lòng nhập số điện thoại liên hệ!'); return; }
    if (!/^0\d{9,10}$/.test(phone)) { alert('Số điện thoại không hợp lệ!'); return; }

    const newPost = {
      id: nextId++,
      type: document.getElementById('f-type').value,
      name,
      district: document.getElementById('f-district').value,
      location,
      phone,
      desc: document.getElementById('f-desc').value.trim() || 'Không có mô tả thêm.',
      img: imgDataUrl || null,
      time: Date.now(),
      isNew: true
    };
    posts.unshift(newPost);
    ['f-name', 'f-location', 'f-desc', 'f-phone'].forEach(id => document.getElementById(id).value = '');
    imgDataUrl = null;
    closeModal();
    renderFeed();
    showToast('✅ Đã đăng tin thành công!');
    setTimeout(() => { newPost.isNew = false; renderFeed(); }, 5000);
  }

  setInterval(() => renderFeed(), 30000);
  renderFeed();
</script>
</body>
</html>
