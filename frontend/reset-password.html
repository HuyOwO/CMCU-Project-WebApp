<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Đồ Thất Lạc HN</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reset-wrap { max-width: 400px; margin: 10vh auto; padding: 2rem 1.75rem; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.12); }
    .reset-wrap .auth-logo { text-align: center; font-size: 28px; margin-bottom: .25rem; }
    .reset-wrap .auth-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <div class="reset-wrap">
    <div class="auth-logo">🔍</div>
    <div class="auth-title">Đặt mật khẩu mới</div>

    <div class="auth-error" id="reset-error"></div>
    <div class="auth-success" id="reset-success"></div>

    <div class="auth-field">
      <label>Mật khẩu mới</label>
      <input type="password" id="reset-pass" placeholder="Tối thiểu 6 ký tự">
    </div>
    <div class="auth-field">
      <label>Xác nhận mật khẩu mới</label>
      <input type="password" id="reset-pass2" placeholder="Nhập lại mật khẩu mới">
    </div>
    <button class="btn-auth" onclick="doResetPassword()">Đặt lại mật khẩu</button>
    <div class="auth-footer-text" style="margin-top:1rem"><a href="index.html">← Quay lại trang chủ</a></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function getTokenFromUrl() {
      return new URLSearchParams(window.location.search).get('token');
    }

    async function doResetPassword() {
      const errEl = document.getElementById('reset-error');
      const okEl = document.getElementById('reset-success');
      errEl.style.display = 'none';
      okEl.style.display = 'none';

      const token = getTokenFromUrl();
      const pass = document.getElementById('reset-pass').value;
      const pass2 = document.getElementById('reset-pass2').value;

      if (!token) {
        errEl.textContent = '⚠️ Link không hợp lệ — thiếu mã token.';
        errEl.style.display = 'block';
        return;
      }
      if (!pass || pass.length < 6) {
        errEl.textContent = '⚠️ Mật khẩu tối thiểu 6 ký tự.';
        errEl.style.display = 'block';
        return;
      }
      if (pass !== pass2) {
        errEl.textContent = '⚠️ Mật khẩu xác nhận không khớp.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const { token: newToken } = await api.put(`/auth/reset-password/${token}`, { password: pass });
        setToken(newToken);
        okEl.textContent = '✅ Đặt lại mật khẩu thành công! Đang chuyển về trang chủ...';
        okEl.style.display = 'block';
        setTimeout(() => (window.location.href = 'index.html'), 1500);
      } catch (err) {
        errEl.textContent = '⚠️ ' + err.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
